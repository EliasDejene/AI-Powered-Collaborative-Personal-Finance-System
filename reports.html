<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finance - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-sidebar.css">
    <style>
        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--teal);
            font-weight: 700;
            margin-bottom: 14px;
        }
        
        .report-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .report-table th {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 14px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        
        .report-table td {
            padding: 12px 14px;
            font-size: 0.87rem;
            border-bottom: 1px solid rgba(35, 75, 107, 0.35);
            vertical-align: middle;
        }
        
        .report-table tr:last-child td {
            border-bottom: none;
        }
        
        .report-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .badge-status {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        
        .cat-bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(35, 75, 107, 0.25);
        }
        
        .cat-bar-row:last-child {
            border-bottom: none;
        }
        
        .cat-bar-track {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: var(--bg);
            overflow: hidden;
        }
        
        .cat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }
        
        .summary-stat {
            text-align: center;
            padding: 16px 10px;
        }
        
        .summary-stat .val {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .summary-stat .lbl {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <div id="mobile-topbar">
        <button id="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <span style="font-weight:700;font-size:0.9rem;color:var(--gold)">Reports</span>
    </div>
    <div id="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div class="sidebar-logo">
                <img src="img/logo.png" alt="Logo" style="width:100px; height:100px; border-radius:50%; display:block; margin:0 auto; object-fit: cover;">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="transactions.html" class="nav-link-item"><i class="fas fa-exchange-alt"></i> Transactions</a>
                <a href="ai-budget.html" class="nav-link-item"><i class="fas fa-magic"></i> AI Budget</a>
                <a href="recommendations.html" class="nav-link-item"><i class="fas fa-lightbulb"></i> Recommendations</a>
                <a href="reports.html" class="nav-link-item active"><i class="fas fa-file-alt"></i> Reports</a>
                <a href="analytics.html" class="nav-link-item"><i class="fas fa-chart-bar"></i> Analytics</a>
                <a href="about.html" class="nav-link-item"><i class="fas fa-info-circle"></i> About</a>
            </nav>
        </div>

        <div id="page-content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h5 class="mb-0 fw-bold">Financial Reports</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-light" onclick="exportCSV()"><i class="fas fa-file-csv me-1"></i>Export CSV</button>
                    <button class="btn btn-sm btn-outline-light" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
                </div>
            </div>

            <!-- Summary stats (current month) -->
            <div class="row g-3 mb-4" id="summaryRow">
                <div class="col-6 col-lg-3">
                    <div class="dark-panel summary-stat">
                        <div class="val text-success" id="sumIncome">—</div>
                        <div class="lbl">Income</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="dark-panel summary-stat">
                        <div class="val text-danger" id="sumExpenses">—</div>
                        <div class="lbl">Expenses</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="dark-panel summary-stat">
                        <div class="val" id="sumSavings" style="color:var(--teal)">—</div>
                        <div class="lbl">Net Savings</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="dark-panel summary-stat">
                        <div class="val" id="sumAdherence" style="color:var(--gold)">—</div>
                        <div class="lbl">Budget Used</div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <!-- Monthly table -->
                <div class="col-lg-8">
                    <div class="dark-panel p-4">
                        <div class="section-title">Monthly Summary (Last 6 Months)</div>
                        <div id="tableLoading" class="text-center py-4 text-muted-custom" style="font-size:0.85rem">
                            <i class="fas fa-spinner fa-spin me-2"></i>Loading…
                        </div>
                        <div class="table-responsive" id="reportTableWrap" style="display:none">
                            <table class="report-table">
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>Income (ETB)</th>
                                        <th>Expenses (ETB)</th>
                                        <th>Net Savings</th>
                                        <th>Budget Used</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="reportBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Category breakdown -->
                <div class="col-lg-4">
                    <div class="dark-panel p-4 h-100">
                        <div class="section-title">Category Breakdown</div>
                        <div id="catBreakdown">
                            <div class="text-center py-4 text-muted-custom" style="font-size:0.85rem"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = 'backend';
        const CAT_COLORS = ['#e63946', '#f4a261', '#2a9d8f', '#9d4edd', '#48cae4', '#e9c46a', '#8338ec', '#06d6a0'];
        let reportData = [];

        async function loadReports() {
            try {
                const [monthly, cat, dashboard] = await Promise.all([
                    fetch(`${API_BASE}/reports.php?action=monthly`).then(r => r.json()),
                    fetch(`${API_BASE}/reports.php?action=category`).then(r => r.json()),
                    fetch(`${API_BASE}/reports.php?action=dashboard`).then(r => r.json()),
                ]);
                reportData = monthly.monthly_reports || [];
                renderTable(reportData);
                renderCatBreakdown(cat.categories || []);
                renderSummary(dashboard);
            } catch (e) {
                document.getElementById('tableLoading').innerHTML = `<span class="text-danger">${e.message}</span>`;
            }
        }

        function renderSummary(d) {
            document.getElementById('sumIncome').textContent = fmt(d.total_income || 0);
            document.getElementById('sumExpenses').textContent = fmt(d.total_expenses || 0);
            const rem = d.remaining_budget || 0;
            document.getElementById('sumSavings').textContent = fmt(rem);
            document.getElementById('sumSavings').style.color = rem >= 0 ? 'var(--teal)' : 'var(--red)';
            document.getElementById('sumAdherence').textContent = (d.budget_adherence || 0) + '%';
        }

        function renderTable(rows) {
            document.getElementById('tableLoading').style.display = 'none';
            document.getElementById('reportTableWrap').style.display = 'block';
            document.getElementById('reportBody').innerHTML = rows.map(r => {
                const healthy = r.status === 'Healthy' || r.status === 'Excellent';
                const badgeStyle = healthy ? 'background:#2a9d8f22;color:#2a9d8f;border:1px solid #2a9d8f44' : 'background:#e6394622;color:#e63946;border:1px solid #e6394644';
                const savingsColor = parseFloat(r.net_savings) >= 0 ? 'color:#48cae4' : 'color:#e63946';
                return `<tr>
            <td class="fw-bold">${r.label}</td>
            <td style="color:#2a9d8f">${fmt(r.income)}</td>
            <td style="color:#e63946">${fmt(r.expenses)}</td>
            <td style="${savingsColor};font-weight:600">${fmt(r.net_savings)}</td>
            <td>${r.budget_adherence}%</td>
            <td><span class="badge-status" style="${badgeStyle}">${r.status}</span></td>
        </tr>`;
            }).join('');
        }

        function renderCatBreakdown(cats) {
            const el = document.getElementById('catBreakdown');
            if (!cats.length) {
                el.innerHTML = '<p class="text-muted-custom text-center" style="font-size:0.82rem">No expense data this month.</p>';
                return;
            }
            const max = parseFloat(cats[0].total);
            el.innerHTML = cats.map((c, i) => `
        <div class="cat-bar-row">
            <div style="width:130px;font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.category}</div>
            <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${max>0?Math.round(c.total/max*100):0}%;background:${CAT_COLORS[i%CAT_COLORS.length]}"></div></div>
            <div style="font-size:0.78rem;font-weight:600;white-space:nowrap">${fmtS(c.total)}</div>
        </div>
    `).join('');
        }

        function exportCSV() {
            if (!reportData.length) {
                alert('No data to export.');
                return;
            }
            const rows = [
                ['Month', 'Income (ETB)', 'Expenses (ETB)', 'Net Savings', 'Budget Adherence %', 'Status'], ...reportData.map(r => [r.label, r.income, r.expenses, r.net_savings, r.budget_adherence, r.status])
            ];
            const csv = rows.map(r => r.join(',')).join('\n');
            const a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = 'finance_report.csv';
            a.click();
        }

        function fmt(n) {
            return Number(n).toLocaleString('en-US', {
                maximumFractionDigits: 0
            }) + ' ETB';
        }

        function fmtS(n) {
            return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n);
        }

        function toggleSidebar() {
            document.getElementById('sidebar-wrapper').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar-wrapper').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }

        loadReports();
    </script>
</body>

</html>
