<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Powered Finance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #183B55;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 0;
        }
        
        .signup-card {
            background-color: #0d2130;
            border: 1px solid #234b6b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        .logo-area {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Optional: keep border-radius if you want to ensure the img stays clipped */
            border-radius: 50%;
            overflow: hidden;
        }
        
        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* This ensures the full logo fits inside the 80px area */
        }
        
        h3 {
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #a9c2d4;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-control {
            background-color: #183B55;
            border: 1px solid #234b6b;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .form-control:focus {
            background-color: #183B55;
            color: #ffffff;
            border-color: #d4a017;
            box-shadow: none;
        }
        
        .btn-signup {
            background-color: #d4a017;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
        }
        
        .btn-signup:hover {
            background-color: #c29214;
            transform: translateY(-2px);
        }
        
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a9c2d4;
        }
        
        .footer-link a {
            color: #48cae4;
            text-decoration: none;
        }
        
        .name-row {
            display: flex;
            gap: 15px;
        }
        
        .name-row div {
            flex: 1;
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo">
        </div>
        <h3>Create Profile</h3>
        <p class="subtitle">Join the AI-powered financial revolution.</p>

        <div id="alertBox" class="alert d-none mb-3"></div>

        <form id="signupForm">
            <div class="name-row">
                <div><input type="text" id="firstName" class="form-control" placeholder="First Name" required></div>
                <div><input type="text" id="lastName" class="form-control" placeholder="Last Name" required></div>
            </div>
            <input type="email" id="email" class="form-control" placeholder="Email" required>
            <input type="password" id="password" class="form-control" placeholder="Password (min 6 chars)" required minlength="6">
            <button type="submit" class="btn btn-signup" id="signupBtn">Create Account</button>
        </form>

        <div class="footer-link">Already have an account? <a href="login.html">Sign In</a></div>
    </div>

    <script>
        const API_BASE = 'backend';

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Profile…';
            btn.disabled = true;

            const body = {
                first_name: document.getElementById('firstName').value.trim(),
                last_name: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            };

            try {
                const res = await fetch(`${API_BASE}/auth.php?action=signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body),
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Registration failed');

                localStorage.setItem('financeUserName', data.user_name);
                window.location.href = 'index.html';

            } catch (err) {
                const box = document.getElementById('alertBox');
                box.className = 'alert alert-danger';
                box.textContent = err.message;
                box.classList.remove('d-none');
                btn.innerHTML = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
