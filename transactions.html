<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finance - Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-sidebar.css">
    <style>
        .tx-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .tx-table th {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .tx-table td {
            padding: 10px 12px;
            font-size: 0.87rem;
            border-bottom: 1px solid rgba(35, 75, 107, 0.35);
            vertical-align: middle;
        }
        
        .tx-table tr:last-child td {
            border-bottom: none;
        }
        
        .tx-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .badge-cat {
            font-size: 0.7rem;
            padding: 2px 9px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .ai-badge {
            background: rgba(212, 160, 23, 0.18);
            color: var(--gold);
            border: 1px solid rgba(212, 160, 23, 0.4);
            font-size: 0.7rem;
            padding: 1px 7px;
            border-radius: 10px;
        }
        
        .ai-thinking {
            color: var(--teal);
            font-size: 0.75rem;
            animation: pulse 1.4s infinite;
        }
        
        @keyframes pulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: 0.4
            }
        }
        
        .filter-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        
        .page-title {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--teal);
            font-weight: 700;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>

    <div id="mobile-topbar">
        <button id="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <span style="font-weight:700;font-size:0.9rem;color:var(--gold)">Transactions</span>
    </div>
    <div id="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <div class="sidebar-logo">
                <img src="img/logo.png" alt="Logo" style="width:100px; height:100px; border-radius:50%; display:block; margin:0 auto; object-fit: cover;">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="transactions.html" class="nav-link-item active"><i class="fas fa-exchange-alt"></i> Transactions</a>
                <a href="ai-budget.html" class="nav-link-item"><i class="fas fa-magic"></i> AI Budget</a>
                <a href="recommendations.html" class="nav-link-item"><i class="fas fa-lightbulb"></i> Recommendations</a>
                <a href="reports.html" class="nav-link-item"><i class="fas fa-file-alt"></i> Reports</a>
                <a href="analytics.html" class="nav-link-item"><i class="fas fa-chart-bar"></i> Analytics</a>
                <a href="about.html" class="nav-link-item"><i class="fas fa-info-circle"></i> About</a>
            </nav>
        </div>

        <div id="page-content-wrapper">
            <div class="page-title mb-4">Transactions</div>
            <div class="row g-3">

                <!-- Add Transaction -->
                <div class="col-lg-4">
                    <div class="dark-panel p-4">
                        <div class="section-title">Add Transaction</div>
                        <div id="formAlert" class="alert d-none py-2" style="font-size:0.85rem"></div>
                        <form id="txForm">
                            <div class="mb-3">
                                <label class="form-label text-muted-custom" style="font-size:0.82rem">Description</label>
                                <input type="text" id="descInput" class="form-control" placeholder="e.g. Lunch at Kaldi's" required>
                                <div id="aiHint" class="ai-thinking mt-1 d-none"><i class="fas fa-robot me-1"></i>AI is categorizing…</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted-custom" style="font-size:0.82rem">Amount (ETB)</label>
                                <input type="number" id="amountInput" class="form-control" placeholder="0.00" min="0.01" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted-custom" style="font-size:0.82rem">Type</label>
                                <select id="typeSelect" class="form-select">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted-custom" style="font-size:0.82rem">
                                Category <span class="ai-badge ms-1 d-none" id="aiTag">AI ✓</span>
                            </label>
                                <select id="catSelect" class="form-select">
                                <option value="" disabled selected>Select category</option>
                                <option>Food & Dining</option><option>Transportation</option>
                                <option>Utilities</option><option>Entertainment</option>
                                <option>Health</option><option>Housing</option>
                                <option>Education</option><option>Savings</option>
                                <option>Income</option><option>Other</option>
                            </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted-custom" style="font-size:0.82rem">Date</label>
                                <input type="date" id="dateInput" class="form-control">
                            </div>
                            <button type="submit" id="saveBtn" class="btn btn-warning w-100 fw-bold">
                            <i class="fas fa-plus me-2"></i>Save Transaction
                        </button>
                        </form>
                    </div>
                </div>

                <!-- Transaction History -->
                <div class="col-lg-8">
                    <div class="dark-panel p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <div class="section-title mb-0">Transaction History</div>
                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
                                <button class="filter-btn" onclick="setFilter('income',this)">Income</button>
                                <button class="filter-btn" onclick="setFilter('expense',this)">Expense</button>
                                <div class="input-group" style="width:180px">
                                    <span class="input-group-text" style="background:var(--bg-dark);border-color:var(--border);color:var(--muted);font-size:0.8rem"><i class="fas fa-search"></i></span>
                                    <input type="text" id="searchInput" class="form-control" style="border-left:none!important;font-size:0.82rem" placeholder="Search…">
                                </div>
                            </div>
                        </div>

                        <div id="txLoading" class="text-center py-5 text-muted-custom" style="font-size:0.85rem">
                            <i class="fas fa-spinner fa-spin me-2"></i>Loading transactions…
                        </div>
                        <div class="table-responsive" id="txTableWrap" style="display:none">
                            <table class="tx-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Description</th>
                                        <th>Category</th>
                                        <th style="text-align:right">Amount</th>
                                        <th style="text-align:center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="txBody"></tbody>
                            </table>
                        </div>
                        <div id="txEmpty" class="text-center py-5 text-muted-custom d-none">
                            <i class="fas fa-inbox fa-3x mb-3 d-block" style="opacity:0.3"></i> No transactions found. Add your first one!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'backend';
        let allTx = [],
            activeFilter = 'all',
            aiSuggested = false;

        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

        // Load transactions
        async function loadTx() {
            try {
                const res = await fetch(`${API_BASE}/transactions.php`);
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                allTx = d.transactions || [];
                renderTx();
            } catch (e) {
                document.getElementById('txLoading').innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>${e.message}</span>`;
            }
        }

        function renderTx() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            let list = allTx;
            if (activeFilter !== 'all') list = list.filter(t => t.type === activeFilter);
            if (q) list = list.filter(t => t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));

            document.getElementById('txLoading').style.display = 'none';
            const wrap = document.getElementById('txTableWrap');
            const empty = document.getElementById('txEmpty');

            if (!list.length) {
                wrap.style.display = 'none';
                empty.classList.remove('d-none');
                return;
            }
            empty.classList.add('d-none');
            wrap.style.display = 'block';

            const catStyle = {
                'Food & Dining': 'background:#f4a26122;color:#f4a261;border:1px solid #f4a26144',
                'Transportation': 'background:#f4a26122;color:#f4a261;border:1px solid #f4a26144',
                'Utilities': 'background:#48cae422;color:#48cae4;border:1px solid #48cae444',
                'Entertainment': 'background:#8338ec22;color:#8338ec;border:1px solid #8338ec44',
                'Health': 'background:#e6394622;color:#e63946;border:1px solid #e6394644',
                'Housing': 'background:#3a86ff22;color:#3a86ff;border:1px solid #3a86ff44',
                'Income': 'background:#2a9d8f22;color:#2a9d8f;border:1px solid #2a9d8f44',
                'Savings': 'background:#06d6a022;color:#06d6a0;border:1px solid #06d6a044',
                'Education': 'background:#118ab222;color:#118ab2;border:1px solid #118ab244',
            };

            document.getElementById('txBody').innerHTML = list.map(tx => {
                const isIn = tx.type === 'income';
                const date = new Date(tx.transaction_date).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric'
                });
                const style = isIn ? 'background:#2a9d8f22;color:#2a9d8f;border:1px solid #2a9d8f44' : (catStyle[tx.category] || 'background:#6c757d22;color:#aaa;border:1px solid #6c757d44');
                const amtC = isIn ? '#2a9d8f' : '#e63946';
                const aiTag = tx.ai_suggested == '1' ? '<span class="ai-badge ms-1">AI</span>' : '';
                return `<tr>
            <td class="text-muted-custom" style="white-space:nowrap">${date}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tx.description)}</td>
            <td><span class="badge-cat" style="${style}">${tx.category}</span>${aiTag}</td>
            <td style="text-align:right;font-weight:600;color:${amtC}">${isIn?'+':'-'}${Number(tx.amount).toLocaleString('en-US',{maximumFractionDigits:0})} ETB</td>
            <td style="text-align:center">
                <button class="btn btn-sm" style="color:var(--red);background:none;border:none;padding:2px 6px" onclick="deleteTx(${tx.id})" title="Delete">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </td>
        </tr>`;
            }).join('');
        }

        function setFilter(f, btn) {
            activeFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTx();
        }

        // AI categorization on blur
        document.getElementById('descInput').addEventListener('blur', async function() {
            const desc = this.value.trim();
            if (!desc) return;
            document.getElementById('aiHint').classList.remove('d-none');
            document.getElementById('aiTag').classList.add('d-none');
            aiSuggested = false;
            try {
                const res = await fetch(`${API_BASE}/ai-categorize.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: desc
                    })
                });
                const d = await res.json();
                if (d.category) {
                    document.getElementById('catSelect').value = d.category;
                    document.getElementById('aiTag').classList.remove('d-none');
                    aiSuggested = true;
                }
            } catch (_) {} finally {
                document.getElementById('aiHint').classList.add('d-none');
            }
        });

        // Save transaction
        document.getElementById('txForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
            try {
                const res = await fetch(`${API_BASE}/transactions.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: document.getElementById('descInput').value.trim(),
                        amount: parseFloat(document.getElementById('amountInput').value),
                        type: document.getElementById('typeSelect').value,
                        category: document.getElementById('catSelect').value || 'Other',
                        date: document.getElementById('dateInput').value,
                        ai_suggested: aiSuggested ? 1 : 0
                    })
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                showAlert('Transaction saved successfully!', 'success');
                this.reset();
                document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
                document.getElementById('aiTag').classList.add('d-none');
                aiSuggested = false;
                loadTx();
            } catch (e) {
                showAlert(e.message, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus me-2"></i>Save Transaction';
            }
        });

        async function deleteTx(id) {
            if (!confirm('Delete this transaction?')) return;
            try {
                const res = await fetch(`${API_BASE}/transactions.php?id=${id}`, {
                    method: 'DELETE'
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                loadTx();
            } catch (e) {
                alert(e.message);
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderTx);

        function showAlert(msg, type) {
            const el = document.getElementById('formAlert');
            el.className = `alert alert-${type} py-2`;
            el.textContent = msg;
            el.classList.remove('d-none');
            setTimeout(() => el.classList.add('d-none'), 4000);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(s));
            return d.innerHTML;
        }

        function toggleSidebar() {
            document.getElementById('sidebar-wrapper').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar-wrapper').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }

        loadTx();
    </script>
</body>

</html>
