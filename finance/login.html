<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Powered Finance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #183B55;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        
        .login-card {
            background-color: #0d2130;
            border: 1px solid #234b6b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        
        .logo-area {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Optional: keep border-radius if you want to ensure the img stays clipped */
            border-radius: 50%;
            overflow: hidden;
        }
        
        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* This ensures the full logo fits inside the 80px area */
        }
        
        h3 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        p {
            color: #a9c2d4;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        
        .form-label {
            color: #a9c2d4;
            float: left;
            font-size: 0.85rem;
            margin-left: 5px;
        }
        
        .form-control {
            background-color: #183B55;
            border: 1px solid #234b6b;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            background-color: #183B55;
            color: #ffffff;
            border-color: #d4a017;
            box-shadow: none;
        }
        
        .btn-login {
            background-color: #d4a017;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .btn-login:hover {
            background-color: #c29214;
            transform: translateY(-2px);
        }
        
        .extra-links {
            margin-top: 25px;
            font-size: 0.85rem;
        }
        
        .extra-links a {
            color: #48cae4;
            text-decoration: none;
        }
        
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo">
        </div>
        <h3>Welcome Back</h3>
        <p>Please enter your details to sign in.</p>

        <div id="alertBox" class="alert d-none"></div>

        <form id="loginForm">
            <div class="mb-1 text-start">
                <label class="form-label">Email Address</label>
                <input type="email" id="emailInput" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-1 text-start">
                <label class="form-label">Password</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small" for="remember" style="color:#a9c2d4!important;">Remember me</label>
                </div>
                <a href="#" class="small" style="color:#48cae4;text-decoration:none;">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="extra-links">
            <span style="color:#a9c2d4;">Don't have an account?</span>
            <a href="signup.html">Create Account</a>
        </div>
    </div>

    <script>
        const API_BASE = 'backend'; // ← same as transactions.html

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating…';
            btn.disabled = true;

            const body = {
                email: document.getElementById('emailInput').value.trim(),
                password: document.getElementById('passwordInput').value,
            };

            try {
                const res = await fetch(`${API_BASE}/auth.php?action=login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body),
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Login failed');

                // Store user name for dashboard greeting
                localStorage.setItem('financeUserName', data.user_name);
                window.location.href = 'index.html';

            } catch (err) {
                const box = document.getElementById('alertBox');
                box.className = 'alert alert-danger';
                box.textContent = err.message;
                box.classList.remove('d-none');
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
